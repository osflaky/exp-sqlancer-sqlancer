name: ci

on:
  workflow_dispatch:
jobs:
  misc:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: General tests [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
          # Temurin publishes no JDK 11 build for Windows on ARM64; Microsoft's OpenJDK build does.
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'microsoft' || 'temurin' }}
        java-version: '11'
        cache: 'maven'
    - name: Verify
      run: mvn -B verify -DskipTests=true
    - name: Misc Tests
      run: mvn '-Djacoco.skip=true' -B 
        '-Dtest=!sqlancer.dbms.**,!sqlancer.qpg.**' test
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
          # Native Windows ARM64 Python builds for setup-python start at 3.11.
        python-version: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && '3.11' || '3.10' }}
    - name: Naming Convention Tests
      run: python src/check_names.py

    timeout-minutes: 150
